[project]
name = "overseer"
version = "0.1.0"
description = "Master AI orchestrator for multi-agent Claude Code workflows"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "websockets>=13",
  "anyio>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["overseer*"]
